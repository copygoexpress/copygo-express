<style>
:root{--n:#071B70;--r:#073DCB;--c:#12A9D5;--y:#FFC400;--g:#F4F8FC;--ink:#0d1f55;--mu:#5B6B8C;--bd:#DCE6F5;--e:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{font:13px/1.45 Montserrat,system-ui,sans-serif;color:var(--ink);background:var(--g);padding-bottom:76px}
a{color:inherit}img{max-width:100%}button{font:inherit;color:inherit}
.w{max-width:1040px;margin:auto;padding:0 14px}
.top{background:var(--n);color:#fff;font-size:12px;font-weight:600}.top .w{display:flex;align-items:center;justify-content:space-between;gap:8px;height:36px}.top .mid{opacity:.9}
.si{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#ffffff22;color:#fff;border:0;cursor:pointer;margin-left:5px;transition:transform .2s var(--e),background .2s}.si:hover{transform:translateY(-2px);background:#ffffff44}.si svg{width:14px;height:14px}
header{position:sticky;top:0;z-index:20;background:#fff;box-shadow:0 1px 0 var(--bd)}
.bar{display:flex;align-items:center;gap:10px;height:56px;position:relative}.logo img{height:36px;display:block}
nav{margin-left:auto;display:flex;gap:2px}nav a{padding:6px 10px;border-radius:9px;text-decoration:none;font-weight:600;font-size:13px;transition:.2s}nav a:hover{background:var(--g)}nav a.on{background:var(--y)}
.cta{background:var(--y);border-radius:20px;padding:7px 14px;font-weight:800;font-size:13px;text-decoration:none;white-space:nowrap}
.bg{display:none;background:0;border:0;font-size:24px;color:var(--r);cursor:pointer}
@media(max-width:860px){.bg{display:block}.cta{margin-left:auto}nav{display:none;position:absolute;left:-14px;right:-14px;top:100%;background:#fff;flex-direction:column;padding:6px 14px 12px;margin:0;box-shadow:0 12px 22px #071b7022}nav.open{display:flex}}
.page{animation:in .4s var(--e) both;padding:12px 0}@keyframes in{from{opacity:0;transform:translateY(10px)}}
h2{font-size:15px;color:var(--n);margin:14px 0 6px;text-align:center}h1.t{font-size:19px;color:var(--n);margin:4px 0 8px}
.hero{position:relative;background:#fff;border-radius:0 0 20px 20px;overflow:hidden;min-height:380px;display:flex;align-items:center}
.hero .tx{position:relative;z-index:1;width:56%;padding:22px 14px 22px 24px}
.hero h1{font-size:clamp(26px,5vw,48px);line-height:1;color:var(--n);font-weight:800;letter-spacing:-.5px}.hero h1 b{color:var(--c)}
.sl{font-weight:600;font-size:clamp(13px,2.2vw,20px);margin:8px 0 6px;color:var(--n)}.ds{font-size:clamp(12px,1.7vw,15px);margin-bottom:8px}
.bn3{list-style:none;padding:0;margin:0 0 10px;display:flex;flex-wrap:wrap;gap:2px 12px}.bn3 li{color:var(--c);font-weight:700;font-size:clamp(11px,1.6vw,14px);white-space:nowrap}
.hero .ph{position:absolute;inset:0}.hero .ph img{width:100%;height:100%;object-fit:cover;object-position:right 8%;display:block;animation:fl 9s ease-in-out infinite;transform-origin:right center}
@media(max-width:700px){.hero{display:block;min-height:0}.hero .tx{width:100%;padding:16px 16px 6px}.hero .ph{position:relative;height:270px}}
@keyframes fl{50%{transform:scale(1.03)}}
.top .w>span{white-space:nowrap}@media(max-width:700px){.svr,.pays{grid-template-columns:repeat(6,1fr)}.svr>:nth-child(-n+3),.pays>:nth-child(-n+3){grid-column:span 2}.svr>:nth-child(n+4),.pays>:nth-child(n+4){grid-column:span 3}}@media(max-width:700px){.top .mid{display:none}.top .w{font-size:11px}.top .si{margin-left:3px}.hero .ph img{-webkit-mask-image:linear-gradient(180deg,transparent,#000 16%);mask-image:linear-gradient(180deg,transparent,#000 16%)}}
.btn{display:inline-block;border:0;border-radius:11px;padding:10px 14px;font-weight:800;font-size:12.5px;text-decoration:none;cursor:pointer;margin:4px 6px 0 0;transition:transform .18s var(--e),box-shadow .18s}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 16px #073dcb33}.btn:active{transform:scale(.97)}
.y{background:var(--y);color:var(--ink)}.bl{background:var(--r);color:#fff}.gn,.g{background:#25D366;color:#fff}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px;overflow:hidden}
.cl{cursor:pointer;transition:transform .25s var(--e),box-shadow .25s;text-align:left;background:#fff;border:1px solid var(--bd);border-radius:14px}.cl:hover{transform:translateY(-3px);box-shadow:0 10px 22px #073dcb22}
.svr{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}@media(max-width:700px){.svr{grid-template-columns:repeat(3,1fr)}}
.svr .cl{padding:10px 4px;text-align:center;font-weight:700;font-size:12px;color:var(--n)}.svr .cl i{display:block;font-style:normal;font-size:24px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}@media(max-width:760px){.tri{grid-template-columns:1fr}}
.tri .cl{padding:12px}.tri b.h{display:inline-block;background:var(--n);color:#fff;border-radius:8px;padding:3px 10px;font-size:13px;margin-bottom:6px}
.tri .row,.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0;font-weight:600}.pr{background:var(--r);color:#fff;border-radius:7px;padding:1px 9px;font-weight:800}
.fr{background:var(--y);display:inline-block;border-radius:7px;padding:2px 8px;font-weight:700;font-size:12px;margin-top:4px}
.pays{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}@media(max-width:700px){.pays{grid-template-columns:repeat(3,1fr)}}
.pay{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:84px;font-weight:600;font-size:11px;text-align:center;transition:.25s var(--e)}.pay:hover{transform:translateY(-3px);box-shadow:0 8px 18px #073dcb22}.pay img{height:42px;width:auto;border-radius:8px;display:block}.pay small{display:block;font-weight:500;color:var(--mu)}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.shop img{width:100%;height:130px;object-fit:cover;border-radius:12px;transition:transform .4s var(--e)}.shop img:hover{transform:scale(1.03)}

const csv=t=>t.trim().split(/\r?\n/).map(l=>l.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(x=>x.replace(/^"|"$/g,"").trim()));

async function loadData(){
 if(!SHEET_ID)return;
 const [a,b,c,s,z,p,v,f,m,cl,su]=await Promise.all(["Config","Tarifs","Reductions","Services","Zones","Partenaires","Avis","FAQ","Promo_Codes","Clients_Fideles","Suivi"].map(tab));

 a?.forEach(o=>{const k=K[o.cle];if(k)D[k]=["urg","norm","free","bonus"].includes(k)?+o.valeur:o.valeur;else if(o.cle.startsWith("detail_")){D.dt[o.cle]=o.valeur}else if(["orange_money","moov_money","mtn_momo","wave"].includes(o.cle)){D.mm[o.cle]=o.valeur}else if(o.cle.startsWith("image_")){if(o.valeur)D.im[o.cle.slice(6)]=o.valeur}else if(["facebook","instagram","tiktok"].includes(o.cle))D.soc[o.cle]=o.valeur});
 b?.forEach(o=>{if(o.type=="nb")D.nb=+o.prix;if(o.type=="co")D.co=+o.prix});
 if(c?.length)D.red=c.map(o=>[+o.pages_min,+o.pourcentage]).sort((x,y)=>x[0]-y[0]);
 if(s?.length)D.sv=s.map((o,i)=>{const d=D.sv[i]||[];return[o.titre,o.description,o.icone||d[2],o.image||d[3],o.details]});
 if(z?.length)D.zn=z.map(o=>[o.quartier,o.delai_urgent,o.delai_normal]);
 if(p)D.pa=p; if(v)D.av=v;
 if(f?.length)D.fq=f.map(o=>[o.question,o.reponse]);

 su?.forEach(o=>D.su[o.numero.toUpperCase()]=o.statut);
}

<h2>Nos Services</h2><div class="svr">${[["Photocopie",0],["Impression",2],["Livraison",5],["Scan",4],["Gros volumes",3]].map(s=>`<button class="cl" data-m="${svM(s[1])}"><i>${ico(D.sv[s[1]]?.[2])}</i>${s[0]}</button>`).join("")}</div>

<button class="cl" data-m="${mk("Frais de livraison",dt("detail_livraison","")+livH())}"><b class="h">Frais de Livraison</b><div class="row">Urgente <b>${D.urg} F</b></div><div class="row">Non urgente <b>${D.norm} F</b></div><span class="more">Voir détails ›</span></button>
<button class="cl promo" data-m="${mk("Codes promo",dt("detail_promo","")+promH())}"><div><b class="h" style="background:var(--y);color:var(--ink)">${ico(D.im.ic_ticket)} Codes Promo</b><div style="font-size:15px;font-weight:800;color:var(--n);white-space:nowrap;margin:4px 0">Livraison Gratuite*</div><span class="mu">*Sous conditions</span><br><span class="more">En profiter ›</span></div><div class="pgw"><img src="${D.im.gift}" alt=""></div></button></div>

${D.av.length?`<h2>Avis clients</h2><div class="grid">${D.av.map(a=>`<div class="card">${"⭐".repeat(Math.min(5,+a.note||5))}<p>${esc(a.avis)}</p><b>${esc(a.nom)}</b></div>`).join("")}</div>`:""}`,

livraison:()=>`${head("Livraison")}<div class="card sc">${img(D.im.b_liv)}${livH()}</div><h2>Ce qu’il faut renseigner</h2><div class="card">Adresse de récupération · adresse de livraison · nom et téléphone du destinataire · urgence · instructions. Le prix s’affiche avant confirmation.</div>`,
promotions:()=>`${head("Promotions")}<div class="grid"><div class="card"><b>${ico(D.im.ic_ticket)} Codes promo</b><p>${promH().split("</p>")[0].replace(/^<p>/,"")}</p></div><div class="card"><b>${ico(D.im.ic_vol)} Gros volumes</b>${redT()}</div><div class="card"><b>${ico(D.im.ic_hand)} Clients fidèles</b><p>Récompenses et paiement à la livraison après validation de votre historique.</p></div>${D.grp?`<div class="card"><b>${ico(D.im.ic_doc)} Offre groupe</b><p>${esc(D.grp)}</p></div>`:""}</div><p class="mu" style="margin-top:8px">Livraison gratuite sous conditions, communiquées par COPYGO EXPRESS.</p>${cta()}`,
apropos:()=>`${head("À propos")}<div class="ab">${img(D.im.portrait)}<div class="card">${[["Notre identité","COPYGO EXPRESS est un service de photocopie, d’impression, de numérisation et de livraison de documents à Yamoussoukro."],["Notre mission","Vous faire gagner du temps : vous envoyez vos documents, nous les traitons et nous les livrons."],["Notre vision","Devenir la référence du service de documents rapide en Côte d’Ivoire, ville après ville."],["Notre engagement","Des documents traités avec soin, des prix clairs et un service fiable."],["Notre fonctionnement","1. Vous commandez et envoyez vos fichiers. 2. Nous imprimons. 3. Nous livrons ou vous retirez."],["Notre responsable","Yaya Sanogo, responsable de COPYGO EXPRESS."]].map(a=>`<details><summary>${a[0]}</summary><p>${a[1]}</p></details>`).join("")}</div></div>`,
faq:()=>`${head("Questions fréquentes")}<div class="card">${D.fq.map(f=>`<details><summary>${esc(f[0])}</summary><p>${esc(f[1])}</p></details>`).join("")}</div>`,
commander:()=>`${head("Commander")}<div class="form"><div class="card"><label class="up" for="fl">☁️ <b>Ajouter vos fichiers</b><br>PDF, Word, JPG, PNG. Vous les joindrez dans WhatsApp.<div id="fn" class="ok"></div><input id="fl" type="file" multiple></label>
<div class="two"><div><label>Type</label><select id="ty"><option value="nb">Noir & Blanc</option><option value="co">Couleur</option></select></div><div><label>Recto / Verso</label><select id="rv"><option value="1">Recto</option><option value="2">Recto-verso</option></select></div><div><label>Pages</label><input id="pg" type="number" min="1" value="10"></div><div><label>Copies</label><input id="cp" type="number" min="1" value="1"></div></div>

const NAV={accueil:"Accueil",services:"Nos Services",tarifs:"Tarifs",livraison:"Livraison",promotions:"Promotions",apropos:"À propos",faq:"FAQ"};
function calc(){
 const t=$("#ty").value,f=(+$("#pg").value||0)*(+$("#rv").value)*(+$("#cp").value||1),dl=$("#dl").value,cd=$("#cd").value.trim().toUpperCase();
 const u=t=="nb"?D.nb:D.co,sub=f*u,rr=red(f),rd=sub*rr/100,pm=D.pr.find(x=>x.c==cd);let liv=dl=="u"?D.urg:dl=="n"?D.norm:0,pr=0,msg="";
 if(cd&&!pm)msg=`<p class="er">Code inconnu</p>`;
 if(pm){if(sub-rd<pm.min)msg=`<p class="er">Code valable dès ${fc(pm.min)}</p>`;else{msg=`<p class="ok">Code appliqué ✓</p>`;if(pm.t=="pct")pr=(sub-rd)*pm.v/100;if(pm.t=="fix")pr=pm.v;if(pm.t=="liv")liv=0}}
 const base=Math.max(0,sub-rd-pr),fr=liv>0&&D.free>0&&base>=D.free;if(fr)liv=0;const tot=base+liv;
 $("#cm").innerHTML=msg;
 $("#res").innerHTML=`<b>Récapitulatif</b><div><span>${f} faces × ${fc(u)}</span><span>${fc(sub)}</span></div>${rr?`<div><span>Réduction −${rr} %</span><span>−${fc(rd)}</span></div>`:""}${pr?`<div><span>Code promo</span><span>−${fc(pr)}</span></div>`:""}<div><span>Livraison${fr?" offerte":""}</span><span>${fc(liv)}</span></div><div class="t"><span>Total</span><span>${fc(tot)}</span></div>`;
 const files=[...$("#fl").files].map(x=>x.name).join(", ");
 const mg=`Bonjour COPYGO EXPRESS 👋\nCommande : ${$("#pg").value} pages ${t=="nb"?"Noir & Blanc":"Couleur"}, ${+$("#rv").value==2?"recto-verso":"recto"}, ${$("#cp").value} copie(s)\nLivraison : ${dl=="u"?"urgente":dl=="n"?"standard":"retrait"}\nAdresse : ${$("#ad").value||"-"}\nDestinataire : ${$("#nm").value||"-"} ${$("#ph").value}\nInstructions : ${$("#ins").value||"-"}${cd?"\nCode : "+cd:""}${files?"\nFichiers : "+files:""}\nPaiement : ${$("#py").value}\nTotal estimé : ${fc(tot)}\nJ’envoie mes fichiers ci-dessous 📎`;$("#send").href=wa(mg);const me=$("#sendm");if(me)me.href="mailto:"+D.email+"?subject="+encodeURIComponent("Commande COPYGO EXPRESS")+"&body="+encodeURIComponent(mg);
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.1});
function closeM(){$("#md").classList.remove("open")}
function route(){
 const h=PAGES[location.hash.slice(1)]?location.hash.slice(1):"accueil";mc=0;closeM();
 $("#app").innerHTML=`<div class="page">${PAGES[h]()}</div>`;
 $("#nav").innerHTML=Object.entries(NAV).map(([k,v])=>`<a href="#${k}"${k==h?' class="on"':""}>${v}</a>`).join("");
 $("#nav").classList.remove("open");$("#bg").setAttribute("aria-expanded","false");
 document.title=(h=="accueil"?"":(NAV[h]||"Commander")+" – ")+"COPYGO EXPRESS Yamoussoukro";
 if(h=="commander"){["ty","rv","pg","cp","dl","cd","ad","nm","ph","ins","py"].forEach(i=>$("#"+i).oninput=calc);$("#fl").onchange=()=>{$("#fn").textContent=[...$("#fl").files].map(x=>x.name).join(", ");calc()};calc()}
 document.querySelectorAll(".page .cl,.page .card,.page .pay,.page h2,.shop").forEach((e,i)=>{e.classList.add("rv");e.style.transitionDelay=(i%5)*60+"ms";io.observe(e)});
 window.scrollTo(0,0);
}
function shell(){document.querySelectorAll(".lgi").forEach(i=>i.src=U(D.im.logo));$("#mid").textContent=D.ann||"Rapide • Fiable • Proche de vous";const s=soc();$("#s1").innerHTML=s;$("#s2").innerHTML=s;$("#wa").href=wa();$("#wa").innerHTML=ic.wa;$("#pin").src=U(D.im.ic_pin);$("#hd").src=U(D.im.ic_head);$("#w2").href=wa();$("#ft").innerHTML=`WhatsApp ${D.tel}${D.hor?" · "+esc(D.hor):""}<br>© ${new Date().getFullYear()} COPYGO EXPRESS · Yamoussoukro, Côte d’Ivoire`}
document.addEventListener("click",e=>{const x=e.target;if(x.closest(".x")||x.id=="md")return closeM();const b=x.closest("[data-m]");if(b&&!x.closest("a")){const m=MD[b.dataset.m];if(m){$("#mt").textContent=m[0];$("#mc").innerHTML=m[1];$("#md").classList.add("open")}}});
addEventListener("keydown",e=>{if(e.key=="Escape")closeM()});
$("#bg").onclick=()=>{const o=$("#nav").classList.toggle("open");$("#bg").setAttribute("aria-expanded",o)};
addEventListener("hashchange",route);
shell();route();loadData().then(()=>{shell();route()});
</script></body></html>
